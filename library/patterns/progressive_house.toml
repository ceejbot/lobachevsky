name = "progressive_house"
description = "Long builds and evolving patterns perfect for extended listening"
tempo_hint = 124

# Steady progressive kick
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Groove"
intensity = 0.25
humanization = 0.01
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 76
[tracks.pattern_type.groove_type]
groove_type = "Template"
name = "deep_house_shuffle"

# Evolving kick pattern using polyrhythm
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [7, 4]
pattern_length = 4
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.5, probability = 0.3 },
    { beat = 1.75, probability = 0.4 },
    { beat = 3.25, probability = 0.35 },
]
velocity_range = [45, 55]

# Minimal snare/clap
[[tracks]]
voice = "clap"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.85 },
    { beat = 3.0, probability = 0.8 },
]
velocity_range = [58, 68]

# Complex hi-hat pattern with subtle swing
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.6
subdivision = 0.125
[tracks.pattern_type.base_pattern]
type = "Polyrhythmic"
time_signature = [5, 4]
pattern_length = 3
[tracks.pattern_type.base_pattern.base_pattern]
type = "Euclidean"
hits = 8
steps = 15
rotation = 2
velocity = 40

# Open hi-hats for dynamics
[[tracks]]
voice = "hihat_open"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.75, probability = 0.4 },
    { beat = 2.25, probability = 0.35 },
    { beat = 3.75, probability = 0.3 },
]
velocity_range = [42, 52]

# Ride for atmospheric texture
[[tracks]]
voice = "ride"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.25, probability = 0.2 },
    { beat = 1.5, probability = 0.25 },
    { beat = 2.75, probability = 0.18 },
]
velocity_range = [30, 40]