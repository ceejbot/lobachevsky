# Progressive trance buildup pattern
# Characteristics: Building energy, adding layers, classic trance structure
# Tempo range: 128-136 BPM

name = "trance_progressive_buildup"
description = "Building energy pattern for progressive trance"
tempo_hint = 132
style = "trance"

# Four-on-the-floor kick - the foundation
[[tracks]]
name = "driving_kick"
voice = "Kick"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 1.0 },
    { beat = 1.0, probability = 1.0 },
    { beat = 2.0, probability = 1.0 },
    { beat = 3.0, probability = 1.0 },
]
velocity_range = [108, 114]

# Off-beat bass hits (classic trance)
[[tracks]]
