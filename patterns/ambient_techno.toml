name = "ambient_techno"
description = "Ethereal, slow-moving ambient techno with textural elements"
tempo_hint = 115

# Soft, deep ambient kick
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Groove"
intensity = 0.3
humanization = 0.025
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 65
[tracks.pattern_type.groove_type]
groove_type = "Custom"

[tracks.pattern_type.groove_type.timing_map]
"0.0" = 0.01
"1.0" = -0.005
"2.0" = 0.015
"3.0" = -0.01

# Ghost kicks for ambient texture
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.5, probability = 0.2 },
    { beat = 1.25, probability = 0.15 },
    { beat = 2.75, probability = 0.25 },
    { beat = 3.5, probability = 0.1 },
]
velocity_range = [25, 35]

# Very minimal snare
[[tracks]]
voice = "rim"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 2.0, probability = 0.6 },
]
velocity_range = [40, 50]

# Ethereal hi-hat pattern with polyrhythm
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [11, 8]
pattern_length = 2
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 6
steps = 22
rotation = 5
velocity = 25

# Atmospheric ride
[[tracks]]
voice = "ride"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.25, probability = 0.2 },
    { beat = 1.75, probability = 0.15 },
    { beat = 2.5, probability = 0.25 },
    { beat = 3.25, probability = 0.1 },
]
velocity_range = [20, 30]

# Subtle percussion textures
[[tracks]]
voice = "percussion"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.75, probability = 0.08 },
    { beat = 1.5, probability = 0.06 },
    { beat = 3.75, probability = 0.1 },
]
velocity_range = [18, 28]

# Very sparse shaker for movement
[[tracks]]
voice = "shaker"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.05 },
    { beat = 3.0, probability = 0.04 },
]
velocity_range = [15, 25]