name = "trip_hop"
description = "Downtempo trip hop with heavy swing and laid-back groove"
tempo_hint = 95

# Laid-back kick with swing
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.7
subdivision = 0.5
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 75

# Trip hop snare - classic backbeat with swing
[[tracks]]
voice = "snare"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.68
subdivision = 0.5
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.95 },
    { beat = 3.0, probability = 0.9 },
]
velocity_range = [65, 75]

# Ghost snares for texture
[[tracks]]
voice = "rim"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.75, probability = 0.3 },
    { beat = 1.25, probability = 0.25 },
    { beat = 2.75, probability = 0.35 },
    { beat = 3.25, probability = 0.2 },
]
velocity_range = [35, 50]

# Sparse, swinging hi-hats
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.65
subdivision = 0.25
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 6
steps = 16
rotation = 2
velocity = 40

# Occasional shaker for groove
[[tracks]]
voice = "shaker"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.72
subdivision = 0.125
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.5, probability = 0.4 },
    { beat = 1.5, probability = 0.3 },
    { beat = 2.5, probability = 0.45 },
    { beat = 3.5, probability = 0.25 },
]
velocity_range = [25, 35]