name = "minimal_techno"
description = "Repetitive, hypnotic minimal techno with subtle variations"
tempo_hint = 130

# Clean, precise minimal kick
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Euclidean"
hits = 4
steps = 4
velocity = 80

# Very subtle kick variations
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.75, probability = 0.15 },
    { beat = 2.75, probability = 0.18 },
]
velocity_range = [35, 45]

# Minimal snare - very sparse
[[tracks]]
voice = "rim"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 2.0, probability = 0.7 },
]
velocity_range = [50, 60]

# Hypnotic hi-hat pattern
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Euclidean"
hits = 7
steps = 16
rotation = 1
velocity = 35

# Polyrhythmic percussion for subtle complexity
[[tracks]]
voice = "percussion"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [3, 4]
pattern_length = 4
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 2
steps = 3
velocity = 25

# Very occasional shaker
[[tracks]]
voice = "shaker"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 1.25, probability = 0.1 },
    { beat = 3.5, probability = 0.08 },
]
velocity_range = [20, 30]