[[tracks]]
name = "techno_percussion_groove"
voice = "Percussion"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.8 },
    { beat = 0.75, probability = 0.4 },
    { beat = 1.25, probability = 0.3 },
    { beat = 2.0, probability = 0.7 },
    { beat = 2.75, probability = 0.5 },
    { beat = 3.25, probability = 0.4 },
]
