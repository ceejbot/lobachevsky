name = "deep_hypnotic_alpha"
description = "Deep hypnotic pattern enhanced with 10Hz alpha isochronic tones for enhanced focus"
tempo_hint = 126

# Main deep kick pattern - steady but not mechanical
[[layers]]
voice = "kick"
[layers.pattern_type]
type = "Groove"
intensity = 0.3
humanization = 0.02
[layers.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 75
[layers.pattern_type.groove_type]
groove_type = "Template"
name = "deep_house_shuffle"

# Very subtle off-beat kicks for texture
[[layers]]
voice = "kick_soft"
[layers.pattern_type]
type = "Probability"
points = [
    { beat = 0.75, probability = 0.15 },
    { beat = 2.75, probability = 0.12 },
]
velocity_range = [35, 45]

# Minimal snare/clap - very sparse
[[layers]]
voice = "clap"
[layers.pattern_type]
type = "Probability"
points = [
    { beat = 2.0, probability = 0.85 },
]
velocity_range = [50, 60]

# Subtle rolling hi-hats with swing
[[layers]]
voice = "hihat_closed"
[layers.pattern_type]
type = "Swing"
swing_ratio = 0.6
subdivision = 0.25
[layers.pattern_type.base_pattern]
type = "Euclidean"
