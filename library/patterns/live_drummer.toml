name = "live_drummer"
description = "Realistic human drummer performance with natural velocity variations and subtle rushing/dragging"
tempo_hint = 108

# Kick with natural human variation
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Groove"
intensity = 0.9
humanization = 0.025  # Human-level timing variation
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.98 },
    { beat = 0.5, probability = 0.15 },   # Occasional ghost
    { beat = 1.0, probability = 0.2 },    # Light kick on 2
    { beat = 1.75, probability = 0.6 },   # Syncopated kick
    { beat = 2.0, probability = 0.95 },
    { beat = 2.25, probability = 0.25 },  # Ghost kick
    { beat = 3.0, probability = 0.3 },    # Light on 4
    { beat = 3.5, probability = 0.7 },    # Pre-beat kick
]
velocity_range = [65, 95]  # Wide human range
[tracks.pattern_type.groove_type]
groove_type = "Custom"
[tracks.pattern_type.groove_type.timing_map]
"0.0" = -0.008    # Slightly rushing the downbeat
"0.5" = 0.015     # Late ghost notes
"1.0" = 0.005
"1.75" = -0.012   # Rushing the syncopation
"2.0" = -0.005
"2.25" = 0.02
"3.0" = 0.008     # Dragging beat 4
"3.5" = -0.015    # Rushing into the next bar

# Snare with human dynamics and feel
[[tracks]]
voice = "snare"
[tracks.pattern_type]
type = "Groove"
intensity = 0.85
humanization = 0.03
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.25, probability = 0.1 },   # Rare ghost
    { beat = 1.0, probability = 0.95 },   # Solid backbeat
    { beat = 1.75, probability = 0.4 },   # Fills
    { beat = 2.125, probability = 0.25 },
    { beat = 3.0, probability = 0.9 },    # Solid backbeat
    { beat = 3.625, probability = 0.5 },  # Leading into next bar
]
velocity_range = [60, 105]  # Very wide dynamic range
[tracks.pattern_type.groove_type]
groove_type = "Custom"
[tracks.pattern_type.groove_type.timing_map]
"0.25" = 0.018
"1.0" = -0.006    # Slightly rushing the backbeat
"1.75" = 0.012
"2.125" = 0.025
"3.0" = -0.003
"3.625" = -0.018  # Rushing into the next measure

# Hi-hats with natural human inconsistencies
