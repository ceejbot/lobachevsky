name = "downtempo_breaks"
description = "Downtempo breaks with chopped Amen-style breaks at half-speed, atmospheric and hypnotic"
tempo_hint = 82

# Deep kick with subtle displacement
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Groove"
intensity = 0.35
humanization = 0.03
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 80
[tracks.pattern_type.groove_type]
groove_type = "Custom"
[tracks.pattern_type.groove_type.timing_map]
"0.0" = 0.01
"2.0" = -0.005

# Chopped break-style snare pattern
[[tracks]]
voice = "snare"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.62
subdivision = 0.25
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.95 },
    { beat = 1.5, probability = 0.3 },
    { beat = 2.25, probability = 0.4 },
    { beat = 3.0, probability = 0.85 },
    { beat = 3.75, probability = 0.5 },
]
velocity_range = [70, 85]

