# Open hats with human expression
[[tracks]]
voice = "hihat_open"
[tracks.pattern_type]
type = "Groove"
intensity = 0.8
humanization = 0.04
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.375, probability = 0.3 },
