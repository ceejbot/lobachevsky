# Trance rolling bassline pattern
# Classic rolling bass pattern found in trance and progressive house
# Tempo range: 130-138 BPM

name = "trance_rolling_bassline"
description = "Classic rolling bass pattern for trance"
tempo_hint = 135
style = "trance"

# Standard 4/4 kick
[[tracks]]
name = "four_four_kick"
voice = "Kick"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 1.0 },
    { beat = 1.0, probability = 1.0 },
    { beat = 2.0, probability = 1.0 },
    { beat = 3.0, probability = 1.0 },
]
velocity_range = [114, 121]

# Rolling bass pattern - the signature sound
[[tracks]]
name = "rolling_bass"
voice = "KickSoft"

[tracks.pattern_type]
