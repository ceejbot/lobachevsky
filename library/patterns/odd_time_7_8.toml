name = "odd_time_7_8"
description = "Progressive electronic in 7/8 time with Balkan-influenced accents"
tempo_hint = 125

# 7/8 kick pattern emphasizing the odd meter
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [7, 8]
pattern_length = 2
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 7
velocity = 80

# Snare pattern adapted to 7/8
[[tracks]]
voice = "snare"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [7, 8]
pattern_length = 2
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.2 },
    { beat = 0.5, probability = 0.9 },
    { beat = 1.0, probability = 0.3 },
    { beat = 1.75, probability = 0.85 },
    { beat = 2.5, probability = 0.4 },
    { beat = 3.0, probability = 0.95 },
]
velocity_range = [70, 85]

