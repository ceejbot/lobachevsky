    { beat = 0.25, probability = 0.9 },
    { beat = 0.75, probability = 0.8 },
    { beat = 1.25, probability = 0.9 },
    { beat = 1.75, probability = 0.7 },
    { beat = 2.25, probability = 0.9 },
    { beat = 2.75, probability = 0.8 },
    { beat = 3.25, probability = 0.9 },
    { beat = 3.75, probability = 0.6 },
]
