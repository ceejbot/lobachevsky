# Ambient drone pattern with subtle pulsing
# Inspired by artists like Darren Harper and Porya Hatami
# Characteristics: No kick drum, subtle rhythmic textures, organic feel

name = "drone_ambient_pulse"
description = "Subtle pulsing pattern for ambient drone music"
tempo_hint = 75
style = "drone"

# No kick drum - pure ambient approach

# Very sparse, breath-like hi-hats
[[tracks]]
name = "breathing_hats"
voice = "HiHatClosed"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.3 },
    { beat = 1.5, probability = 0.1 },
    { beat = 4.0, probability = 0.2 },
    { beat = 6.5, probability = 0.1 },
]
velocity_range = [6, 13]

# Shaker creating subtle movement
[[tracks]]
name = "organic_shaker"
voice = "Shaker"

[tracks.pattern_type]
type = "Euclidean"
hits = 5
steps = 32
rotation = 7
velocity = 10  # Extremely soft

# Rim shots as occasional punctuation
[[tracks]]
name = "punctuation"
voice = "Rim"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.1 },
    { beat = 10.0, probability = 0.15 },
]
velocity_range = [19, 25]

# Soft kick appearing very rarely for grounding
[[tracks]]
name = "grounding_pulse"
voice = "KickSoft"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.2 },
    { beat = 8.0, probability = 0.1 },
]
velocity_range = [19, 32]