name = "dub_techno"
description = "Spacious, reverb-heavy dub techno with atmospheric delays"
tempo_hint = 125

# Deep, spacious kick pattern
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Groove"
intensity = 0.5
humanization = 0.02
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 74
[tracks.pattern_type.groove_type]
groove_type = "Template"
name = "dub_delay"

# Subtle kick variations with dub timing
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Groove"
intensity = 0.4
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.25, probability = 0.2 },
    { beat = 1.75, probability = 0.25 },
    { beat = 3.25, probability = 0.15 },
]
velocity_range = [40, 50]
[tracks.pattern_type.groove_type]
groove_type = "Template"
name = "dub_delay"

# Sparse, delayed snare
[[tracks]]
voice = "snare"
[tracks.pattern_type]
type = "Groove"
intensity = 0.6
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.15 },
    { beat = 3.0, probability = 0.2 },
]
velocity_range = [45, 55]
[tracks.pattern_type.groove_type]
groove_type = "Template"
name = "dub_delay"

# Atmospheric hi-hats
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Euclidean"
hits = 5
steps = 16
rotation = 3
velocity = 30

# Spacious ride pattern
[[tracks]]
voice = "ride"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.5, probability = 0.3 },
    { beat = 1.5, probability = 0.25 },
    { beat = 2.5, probability = 0.35 },
    { beat = 3.5, probability = 0.2 },
]
velocity_range = [28, 38]

# Textural percussion
[[tracks]]
voice = "percussion"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 1.25, probability = 0.15 },
    { beat = 2.75, probability = 0.12 },
]
velocity_range = [22, 32]