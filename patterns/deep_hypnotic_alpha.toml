steps = 16
rotation = 2
velocity = 35

# Very sparse percussive texture
[[layers]]
voice = "shaker"
[layers.pattern_type]
type = "Probability"
points = [
    { beat = 0.25, probability = 0.08 },
    { beat = 1.75, probability = 0.10 },
    { beat = 3.25, probability = 0.07 },
]
velocity_range = [25, 35]

# Alpha wave isochronic enhancement (10 Hz for focused relaxation)
[[layers]]
voice = "percussion"
[layers.pattern_type]
