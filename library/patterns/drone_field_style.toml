# Drone pattern inspired by The Field's microhouse-influenced drone music
# Characteristics: Subtle 4/4 pulse, ambient textures, evolving patterns

name = "drone_field_style"
description = "Microhouse-influenced drone pattern inspired by The Field"
tempo_hint = 120
style = "drone"

# Very subtle kick pattern - almost subliminal pulse
[[tracks]]
name = "subtle_kick"
voice = "Kick"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 1.0 },
    { beat = 1.0, probability = 0.3 },
    { beat = 2.0, probability = 0.6 },
    { beat = 3.0, probability = 0.2 },
]
velocity_range = [25, 51]

# Sparse, textural hi-hats
[[tracks]]
name = "texture_hats"
voice = "HiHatClosed"

[tracks.pattern_type]
type = "Euclidean"
hits = 3
steps = 16
rotation = 5
velocity = 19  # Very quiet, textural

# Ambient percussion - like found sounds
[[tracks]]
name = "ambient_texture"
voice = "Shaker"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.25, probability = 0.1 },
    { beat = 0.75, probability = 0.2 },
    { beat = 1.5, probability = 0.1 },
    { beat = 2.0, probability = 0.1 },
    { beat = 2.75, probability = 0.1 },
    { beat = 3.25, probability = 0.2 },
]
velocity_range = [13, 19]

# Occasional ride cymbal for atmosphere
[[tracks]]
name = "atmospheric_ride"
voice = "Ride"

[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.1 },
    { beat = 5.0, probability = 0.15 },
]
velocity_range = [25, 32]