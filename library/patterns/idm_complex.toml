name = "idm_complex"
description = "Complex, intricate rhythmic patterns inspired by intelligent dance music"
tempo_hint = 140

# Base kick in 4/4 for grounding
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Euclidean"
hits = 4
steps = 4
velocity = 72

# Polyrhythmic kick variations in 7/8
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [7, 8]
pattern_length = 2
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 7
rotation = 1
velocity = 55

# Complex snare pattern in 5/4
[[tracks]]
voice = "snare"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [5, 4]
pattern_length = 4
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.8 },
    { beat = 1.2, probability = 0.6 },
    { beat = 2.4, probability = 0.7 },
    { beat = 3.6, probability = 0.5 },
    { beat = 4.8, probability = 0.9 },
]
velocity_range = [60, 75]

# Intricate hi-hat work with swing and polyrhythm
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Swing"
