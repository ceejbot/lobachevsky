name = "ambient_progressive"
description = "Slow progressive builds with atmospheric textures - perfect for long coding sessions"
tempo_hint = 110

# Soft, deep kick pattern
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Euclidean"
hits = 4
steps = 4
velocity = 70

# Ghost kick pattern for subtle movement
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.5, probability = 0.25 },
    { beat = 1.25, probability = 0.20 },
    { beat = 2.5, probability = 0.30 },
    { beat = 3.75, probability = 0.18 },
]
velocity_range = [30, 40]

# Very minimal snare - just enough to maintain pulse
[[tracks]]
voice = "rim"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 2.0, probability = 0.7 },
]
velocity_range = [45, 55]

# Polyrhythmic hi-hats for gentle complexity
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [5, 4]
pattern_length = 4
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 7
steps = 20
rotation = 3
velocity = 30

# Atmospheric ride pattern
[[tracks]]
voice = "ride"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.75, probability = 0.15 },
    { beat = 1.5, probability = 0.18 },
    { beat = 2.25, probability = 0.12 },
    { beat = 3.5, probability = 0.20 },
]
velocity_range = [25, 35]

# Subtle percussion texture
[[tracks]]
voice = "percussion"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.08 },
    { beat = 3.0, probability = 0.06 },
]
velocity_range = [20, 30]