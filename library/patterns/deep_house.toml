name = "deep_house"
description = "Classic deep house with swing, ghost notes, and warm groove"
tempo_hint = 125

# Main kick with classic deep house swing
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.65
subdivision = 0.25
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 78

# Ghost kicks for that deep house bounce
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Groove"
intensity = 0.6
humanization = 0.03
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.25, probability = 0.4 },
    { beat = 1.25, probability = 0.35 },
    { beat = 2.25, probability = 0.45 },
    { beat = 3.25, probability = 0.3 },
]
velocity_range = [40, 50]
[tracks.pattern_type.groove_type]
groove_type = "Template"
name = "deep_house_shuffle"

# Snare/clap on 2 and 4 with slight swing
[[tracks]]
voice = "clap"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.62
subdivision = 0.5
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.95 },
    { beat = 3.0, probability = 0.9 },
]
velocity_range = [60, 70]

# Swinging hi-hats - signature deep house element
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.67
subdivision = 0.125
swing_accent = 8
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 12
steps = 16
rotation = 1
velocity = 42

# Open hi-hats for emphasis
[[tracks]]
voice = "hihat_open"
[tracks.pattern_type]
type = "Probability"
points = [
    { beat = 0.5, probability = 0.6 },
    { beat = 2.5, probability = 0.55 },
]
velocity_range = [45, 55]

# Shaker for continuous groove
[[tracks]]
voice = "shaker"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.63
subdivision = 0.125
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 9
steps = 16
rotation = 2
velocity = 32