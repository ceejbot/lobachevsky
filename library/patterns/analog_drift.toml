name = "analog_drift"
description = "Vintage drum machine emulation with analog timing drift and velocity imperfections"
tempo_hint = 98

# Kick with analog drift - slightly inconsistent timing
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Groove"
intensity = 0.85
humanization = 0.015  # Subtle analog drift
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.0, probability = 1.0 },
    { beat = 1.0, probability = 0.9 },
    { beat = 2.0, probability = 1.0 },
    { beat = 2.75, probability = 0.4 },
    { beat = 3.0, probability = 0.85 },
]
velocity_range = [78, 82]  # Very tight velocity range like analog
[tracks.pattern_type.groove_type]
groove_type = "Custom"
[tracks.pattern_type.groove_type.timing_map]
"0.0" = 0.008
"1.0" = -0.005   # Sometimes early
"2.0" = 0.01
"2.75" = 0.012
"3.0" = -0.003

# Snare with analog character
[[tracks]]
voice = "snare"
[tracks.pattern_type]
