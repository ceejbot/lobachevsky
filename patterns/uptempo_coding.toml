name = "uptempo_coding"
description = "High energy work music - driving but not distracting"
tempo_hint = 130

# Energetic kick pattern
[[layers]]
voice = "kick"
[layers.pattern_type]
type = "Groove"
intensity = 0.25
humanization = 0.01
[layers.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 4
velocity = 80
[layers.pattern_type.groove_type]
groove_type = "Template"
name = "deep_house_shuffle"

# Driving off-beat kicks
[[layers]]
voice = "kick_soft"
[layers.pattern_type]
type = "Probability"
points = [
    { beat = 0.5, probability = 0.4 },
    { beat = 1.5, probability = 0.3 },
    { beat = 2.5, probability = 0.45 },
    { beat = 3.5, probability = 0.25 },
]
velocity_range = [50, 60]

# Strong snare backbeat
[[layers]]
voice = "clap"
[layers.pattern_type]
type = "Probability"
points = [
    { beat = 1.0, probability = 0.95 },
    { beat = 3.0, probability = 0.9 },
]
velocity_range = [70, 80]

# Driving hi-hat pattern
[[layers]]
voice = "hihat_closed"
[layers.pattern_type]
type = "Swing"
swing_ratio = 0.58
subdivision = 0.125
[layers.pattern_type.base_pattern]
type = "Euclidean"
hits = 14
steps = 16
rotation = 1
velocity = 50

# Energetic open hi-hats
[[layers]]
voice = "hihat_open"
[layers.pattern_type]
type = "Probability"
points = [
    { beat = 0.75, probability = 0.5 },
    { beat = 2.75, probability = 0.45 },
]
velocity_range = [45, 60]

# Continuous shaker energy
[[layers]]
voice = "shaker"
[layers.pattern_type]
type = "Euclidean"
hits = 11
steps = 16
rotation = 2
velocity = 42