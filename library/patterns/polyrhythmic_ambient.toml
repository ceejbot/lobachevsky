name = "polyrhythmic_ambient"
description = "Complex polyrhythmic patterns in ambient context - meditative mathematical beauty"
tempo_hint = 108

# Base kick in 4/4 as anchor
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Euclidean"
hits = 4
steps = 4
velocity = 60

# Polyrhythmic kick layer in 5/4
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [5, 4]
pattern_length = 4
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 3
steps = 5
rotation = 1
velocity = 45

# 7/8 snare pattern
[[tracks]]
voice = "rim"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [7, 8]
pattern_length = 2
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.8 },
    { beat = 1.75, probability = 0.6 },
]
velocity_range = [35, 45]

# Complex hi-hat in 11/8
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [11, 8]
pattern_length = 2
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 7
steps = 11
rotation = 2
velocity = 30

# 3/4 ride pattern
[[tracks]]
voice = "ride"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [3, 4]
pattern_length = 4
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 2
steps = 3
velocity = 25

# Textural percussion in 13/16
[[tracks]]
voice = "percussion"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [13, 16]
pattern_length = 1
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 4
steps = 13
rotation = 3
velocity = 20