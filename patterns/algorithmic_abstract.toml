name = "algorithmic_abstract"
description = "Generated variations using mathematical patterns - evolving algorithmic beauty"
tempo_hint = 116

# Primary kick using golden ratio proportions
[[tracks]]
voice = "kick"
[tracks.pattern_type]
type = "Euclidean"
hits = 5
steps = 8  # Fibonacci numbers
velocity = 68

# Secondary kick in different Euclidean ratio
[[tracks]]
voice = "kick_soft"
[tracks.pattern_type]
type = "Euclidean"
hits = 3
steps = 13  # Another Fibonacci number
rotation = 5
velocity = 45

# Polyrhythmic snare based on prime numbers
[[tracks]]
voice = "rim"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [7, 4]  # Prime number time signature
pattern_length = 3
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 2
steps = 7
rotation = 2
velocity = 50

# Hi-hats using complex Euclidean distribution
[[tracks]]
voice = "hihat_closed"
[tracks.pattern_type]
type = "Swing"
swing_ratio = 0.618  # Golden ratio
subdivision = 0.125
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 13  # Fibonacci
steps = 21  # Fibonacci
rotation = 8  # Fibonacci
velocity = 35

# Polyrhythmic ride in irrational time
[[tracks]]
voice = "ride"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [11, 8]
pattern_length = 2
[tracks.pattern_type.base_pattern]
type = "Probability"
points = [
    { beat = 0.0, probability = 0.618 },  # Golden ratio
    { beat = 0.618, probability = 0.382 },  # 1 - golden ratio
    { beat = 1.236, probability = 0.618 },
    { beat = 1.854, probability = 0.382 },
]
velocity_range = [25, 40]

# Complex percussion pattern
[[tracks]]
voice = "shaker"
[tracks.pattern_type]
type = "Polyrhythmic"
time_signature = [17, 16]
pattern_length = 1
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 7
steps = 17
rotation = 11  # Another prime
velocity = 28

# Additional textural layer
[[tracks]]
voice = "percussion"
[tracks.pattern_type]
type = "Groove"
intensity = 0.5
humanization = 0.03
[tracks.pattern_type.base_pattern]
type = "Euclidean"
hits = 8  # Fibonacci
steps = 13  # Fibonacci
rotation = 3
velocity = 22
[tracks.pattern_type.groove_type]
groove_type = "Custom"

[tracks.pattern_type.groove_type.timing_map]
"0.0" = 0.01
"0.618" = -0.01  # Golden ratio timing adjustments
"1.236" = 0.015
"1.854" = -0.005